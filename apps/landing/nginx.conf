server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # 리버스 프록시 뒤에 있으므로 리다이렉트는 상대 경로로 낸다.
    # 이게 없으면 `/docs/mcp-integration` → `/docs/mcp-integration/` 디렉터리 리다이렉트가
    # 컨테이너 내부의 scheme/port로 절대 URL을 만들어(http://erdify.kro.kr:8080/...) 접속이 깨진다.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
