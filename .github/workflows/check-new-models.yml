name: Check new AI models

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 키 검증을 여기서 따로 하지 않는다 — 스크립트가 이미 부분 설정을 처리한다:
      # 키 없는 provider는 [skip], 일부만 없으면 [warn] 후 나머지로 진행,
      # 셋 다 없을 때만 [fatal]로 실패한다. 워크플로에서 "하나라도 없으면 실패"로
      # 앞을 막으면 키가 하나만 있어도 감지를 아예 못 돌리게 된다.
      - name: Detect new models and update models.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # 기본 셸은 pipefail이 없어 `| tee`가 node의 종료 코드를 삼킨다 —
        # provider 조회가 실패해도 잡이 성공으로 끝나던 원인. `shell: bash`가 -eo pipefail을 켠다.
        shell: bash
        run: node scripts/check-new-models.mjs --write | tee .model-check.log

      # 건너뛴 provider를 잡 요약에 남긴다. 초록불이어도 "무엇이 검사되지 않았는지"가
      # 보이지 않으면 부분 검사가 전수 검사처럼 읽힌다.
      - name: Summarize skipped providers
        if: always()
        shell: bash
        run: |
          [ -f .model-check.log ] || exit 0
          skipped=$(grep '^\[skip\]' .model-check.log || true)
          [ -n "$skipped" ] || exit 0
          {
            echo "### ⚠️ 검사되지 않은 provider"
            echo ""
            echo '```'
            echo "$skipped"
            echo '```'
            echo ""
            echo "해당 provider의 신규 모델은 감지되지 않는다."
            echo "Settings → Secrets and variables → Actions 에서 키를 등록하면 다음 주부터 포함된다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: chore/new-ai-models
          base: master
          commit-message: "feat(contracts): 신규 AI 모델 자동 감지 반영"
          title: "feat(contracts): 신규 AI 모델 추가 (자동 감지)"
          add-paths: packages/contracts/src/ai/models.ts
          body: |
            주간 모델 목록 점검(#35)에서 provider API에 새 모델이 발견되어 자동 생성된 PR입니다.

            **리뷰에서 확인할 것:**
            - 라벨 정리 — "(권장)" / "(고성능)" / "(저비용)" 태그와 한국어 라벨은 자동 생성되지 않습니다
            - 순서 — 신규 항목은 각 provider 그룹 **끝**에 삽입됩니다. 기본 선택 모델은 목록 첫 항목이므로, 권장 모델이면 위로 올려주세요
            - 추가하지 않을 모델은 이 PR에서 지우고 `scripts/model-ignore-list.json`에 ID를 추가해 주세요 (다음 주에 다시 감지되지 않도록)

            자세한 실행 로그는 Actions 탭에서 확인하세요.
